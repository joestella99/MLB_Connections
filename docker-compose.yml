version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: mlb_connections_db
    environment:
      POSTGRES_DB: mlb_connections
      POSTGRES_USER: mlb
      POSTGRES_PASSWORD: mlb_dev_pass
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql

volumes:
  pgdata:
