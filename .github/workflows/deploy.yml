name: Daily Puzzle & Deploy

on:
  push:
    branches: [main]
  schedule:
    # Run daily at 6:00 AM UTC (2:00 AM ET)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Install root Angular dependencies
      - run: npm ci

      # Install server dependencies
      - run: cd server && npm ci

      # Daily cron: append one puzzle for today
      # Push/manual: just build what's already in the catalog
      - name: Generate today's puzzle
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: cd server && npx ts-node --transpile-only src/generate-from-api.ts --append

      # Commit updated catalog back to repo (only if changed)
      - name: Commit puzzle catalog
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/puzzles.json
          git diff --cached --quiet || git commit -m "🧩 Daily puzzle for $(date -u +%Y-%m-%d)"
          git push

      # Build Angular for GitHub Pages
      - run: npx ng build --configuration production --base-href /MLB_Connections/

      # Copy 404.html for SPA routing on GitHub Pages
      - name: Copy index.html to 404.html
        run: cp dist/mlb-connections/browser/index.html dist/mlb-connections/browser/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/mlb-connections/browser

      - id: deployment
        uses: actions/deploy-pages@v4
